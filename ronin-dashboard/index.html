<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ronin | 消息看板</title>
    <meta name="description" content="摄影师 Ronin 的消息管理看板">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --bg: #0a0a0a;
            --bg-secondary: #141416;
            --bg-card: #1a1a1c;
            --accent: #c9a87c;
            --accent-hover: #d4b88f;
            --accent-subtle: rgba(201,168,124,0.1);
            --accent-border: rgba(201,168,124,0.25);
            --text: #ffffff;
            --text-secondary: rgba(255,255,255,0.6);
            --text-muted: rgba(255,255,255,0.4);
            --border: rgba(255,255,255,0.08);
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --font-serif: 'Playfair Display', Georgia, serif;
            --font-sans: 'Inter', -apple-system, sans-serif;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }
        
        /* Header */
        .header {
            padding: 1.5rem 2rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-brand {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .header-brand h1 {
            font-family: var(--font-serif);
            font-size: 1.5rem;
            font-weight: 600;
        }
        .header-brand a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.3s;
        }
        .header-brand a:hover { color: var(--accent); }
        .header-stats {
            display: flex;
            gap: 2rem;
        }
        .stat-box {
            text-align: center;
        }
        .stat-box h3 {
            font-size: 1.5rem;
            color: var(--accent);
            font-family: var(--font-serif);
        }
        .stat-box p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        
        /* Main Layout */
        .main {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: calc(100vh - 80px);
        }
        
        /* Sidebar */
        .sidebar {
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            padding: 1.5rem;
        }
        .filter-group {
            margin-bottom: 2rem;
        }
        .filter-group h3 {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1rem;
        }
        .filter-btn {
            width: 100%;
            padding: 0.75rem 1rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        .filter-btn:hover {
            background: var(--bg-card);
            color: var(--text);
        }
        .filter-btn.active {
            background: var(--accent-subtle);
            border-color: var(--accent-border);
            color: var(--accent);
        }
        .filter-btn .badge {
            margin-left: auto;
            background: var(--accent);
            color: var(--bg);
            font-size: 0.7rem;
            padding: 0.2rem 0.5rem;
            border-radius: 10px;
            font-weight: 600;
        }
        .filter-btn.active .badge {
            background: var(--accent);
        }
        
        /* Content */
        .content {
            padding: 2rem;
            overflow-y: auto;
        }
        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        .content-header h2 {
            font-family: var(--font-serif);
            font-size: 1.5rem;
        }
        .search-box {
            position: relative;
        }
        .search-box input {
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            width: 300px;
            font-family: inherit;
        }
        .search-box input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .search-box i {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }
        
        /* Message List */
        .message-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .message-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s;
            cursor: pointer;
        }
        .message-card:hover {
            border-color: var(--accent-border);
        }
        .message-card.unread {
            border-left: 3px solid var(--accent);
        }
        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }
        .message-sender {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .sender-avatar {
            width: 48px;
            height: 48px;
            background: var(--accent-subtle);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            font-weight: 600;
            font-size: 1.1rem;
        }
        .sender-info h4 {
            font-size: 1rem;
            margin-bottom: 0.25rem;
        }
        .sender-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .message-meta {
            text-align: right;
        }
        .message-date {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .message-type {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: var(--accent-subtle);
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--accent);
            margin-top: 0.5rem;
        }
        .message-content {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.7;
            margin-bottom: 1rem;
        }
        .message-actions {
            display: flex;
            gap: 0.75rem;
        }
        .action-btn {
            padding: 0.5rem 1rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s;
        }
        .action-btn:hover {
            background: var(--bg-secondary);
            color: var(--text);
        }
        .action-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--bg);
        }
        .action-btn.primary:hover {
            background: var(--accent-hover);
        }
        .action-btn.success {
            border-color: var(--success);
            color: var(--success);
        }
        .action-btn.success:hover {
            background: rgba(34, 197, 94, 0.1);
        }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }
        .empty-state i {
            width: 64px;
            height: 64px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
        .empty-state h3 {
            font-family: var(--font-serif);
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--text);
        }
        
        /* Notification */
        .notification {
            position: fixed;
            top: 2rem;
            right: 2rem;
            background: var(--bg-card);
            border: 1px solid var(--accent-border);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            z-index: 1000;
            transform: translateX(150%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .notification.show { transform: translateX(0); }
        .notification-icon {
            width: 40px;
            height: 40px;
            background: var(--accent-subtle);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
        }
        .notification-content h4 {
            font-size: 0.95rem;
            margin-bottom: 0.25rem;
        }
        .notification-content p {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        
        /* Responsive */
        @media (max-width: 1024px) {
            .main { grid-template-columns: 1fr; }
            .sidebar { display: none; }
            .header-stats { display: none; }
        }
        @media (max-width: 768px) {
            .header { padding: 1rem; }
            .header-brand h1 { font-size: 1.2rem; }
            .content { padding: 1rem; }
            .search-box input { width: 100%; }
            .message-header { flex-direction: column; gap: 1rem; }
            .message-meta { text-align: left; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-brand">
            <h1>Ronin Dashboard</h1>
            <a href="https://ronineymessjr-sudo.github.io/ronin-portfolio/" target="_blank">
                <i data-lucide="external-link"></i>
                查看网站
            </a>
        </div>
        <div class="header-stats">
            <div class="stat-box">
                <h3 id="totalCount">0</h3>
                <p>总消息</p>
            </div>
            <div class="stat-box">
                <h3 id="newCount">0</h3>
                <p>新消息</p>
            </div>
            <div class="stat-box">
                <h3 id="pendingCount">0</h3>
                <p>待处理</p>
            </div>
        </div>
    </header>

    <!-- Main -->
    <div class="main">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="filter-group">
                <h3>筛选</h3>
                <button class="filter-btn active" data-filter="all" onclick="filterMessages('all')">
                    <i data-lucide="inbox"></i>
                    全部消息
                    <span class="badge" id="allBadge">0</span>
                </button>
                <button class="filter-btn" data-filter="new" onclick="filterMessages('new')">
                    <i data-lucide="mail"></i>
                    新消息
                    <span class="badge" id="newBadge">0</span>
                </button>
                <button class="filter-btn" data-filter="pending" onclick="filterMessages('pending')">
                    <i data-lucide="clock"></i>
                    待处理
                    <span class="badge" id="pendingBadge">0</span>
                </button>
                <button class="filter-btn" data-filter="completed" onclick="filterMessages('completed')">
                    <i data-lucide="check-circle"></i>
                    已完成
                </button>
            </div>
            
            <div class="filter-group">
                <h3>项目类型</h3>
                <button class="filter-btn" data-filter="portrait" onclick="filterByType('portrait')">
                    <i data-lucide="user"></i>
                    人像摄影
                </button>
                <button class="filter-btn" data-filter="commercial" onclick="filterByType('commercial')">
                    <i data-lucide="briefcase"></i>
                    商业摄影
                </button>
                <button class="filter-btn" data-filter="landscape" onclick="filterByType('landscape')">
                    <i data-lucide="mountain"></i>
                    风光摄影
                </button>
                <button class="filter-btn" data-filter="wedding" onclick="filterByType('wedding')">
                    <i data-lucide="heart"></i>
                    婚礼跟拍
                </button>
                <button class="filter-btn" data-filter="event" onclick="filterByType('event')">
                    <i data-lucide="calendar"></i>
                    活动记录
                </button>
            </div>
        </aside>

        <!-- Content -->
        <main class="content">
            <div class="content-header">
                <h2 id="listTitle">全部消息</h2>
                <div class="search-box">
                    <i data-lucide="search"></i>
                    <input type="text" placeholder="搜索消息..." id="searchInput" oninput="searchMessages()">
                </div>
            </div>
            
            <div class="message-list" id="messageList">
                <!-- Messages will be loaded here -->
            </div>
        </main>
    </div>

    <!-- Notification -->
    <div class="notification" id="notification">
        <div class="notification-icon">
            <i data-lucide="bell"></i>
        </div>
        <div class="notification-content">
            <h4>新消息</h4>
            <p>收到新的咨询消息</p>
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Type labels
        const typeLabels = {
            portrait: '人像摄影',
            commercial: '商业摄影',
            landscape: '风光摄影',
            event: '活动记录',
            retouch: '后期修图',
            wedding: '婚礼跟拍',
            other: '其他'
        };

        // Current filter
        let currentFilter = 'all';
        let currentType = null;

        // Load messages
        function loadMessages() {
            return JSON.parse(localStorage.getItem('ronin_messages') || '[]');
        }

        // Save messages
        function saveMessages(messages) {
            localStorage.setItem('ronin_messages', JSON.stringify(messages));
        }

        // Update stats
        function updateStats() {
            var messages = loadMessages();
            var total = messages.length;
            var newMsg = messages.filter(m => m.status === 'new').length;
            var pending = messages.filter(m => m.status === 'pending').length;
            
            document.getElementById('totalCount').textContent = total;
            document.getElementById('newCount').textContent = newMsg;
            document.getElementById('pendingCount').textContent = pending;
            document.getElementById('allBadge').textContent = total;
            document.getElementById('newBadge').textContent = newMsg;
            document.getElementById('pendingBadge').textContent = pending;
        }

        // Format date
        function formatDate(dateString) {
            var date = new Date(dateString);
            var now = new Date();
            var diff = now - date;
            
            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
            if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
            return date.toLocaleDateString('zh-CN');
        }

        // Get initials
        function getInitials(name) {
            return name.charAt(0).toUpperCase();
        }

        // Render messages
        function renderMessages() {
            var messages = loadMessages();
            var list = document.getElementById('messageList');
            var searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            // Filter messages
            var filtered = messages.filter(function(m) {
                // Status filter
                if (currentFilter === 'new' && m.status !== 'new') return false;
                if (currentFilter === 'pending' && m.status !== 'pending') return false;
                if (currentFilter === 'completed' && m.status !== 'completed') return false;
                
                // Type filter
                if (currentType && m.type !== currentType) return false;
                
                // Search filter
                if (searchTerm) {
                    var searchContent = (m.name + ' ' + m.email + ' ' + m.message).toLowerCase();
                    return searchContent.includes(searchTerm);
                }
                
                return true;
            });
            
            if (filtered.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <i data-lucide="inbox"></i>
                        <h3>暂无消息</h3>
                        <p>还没有符合条件的咨询消息</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }
            
            list.innerHTML = filtered.map(function(m) {
                return `
                    <div class="message-card ${m.status === 'new' ? 'unread' : ''}" data-id="${m.id}">
                        <div class="message-header">
                            <div class="message-sender">
                                <div class="sender-avatar">${getInitials(m.name)}</div>
                                <div class="sender-info">
                                    <h4>${m.name}</h4>
                                    <p>${m.email} · ${m.phone}</p>
                                </div>
                            </div>
                            <div class="message-meta">
                                <div class="message-date">${formatDate(m.date)}</div>
                                <span class="message-type">${typeLabels[m.type] || m.type}</span>
                            </div>
                        </div>
                        <div class="message-content">${m.message || '无详细描述'}</div>
                        <div class="message-actions">
                            ${m.status === 'new' ? `
                                <button class="action-btn primary" onclick="markAsPending(${m.id})">
                                    <i data-lucide="clock"></i>
                                    标记待处理
                                </button>
                            ` : ''}
                            ${m.status === 'pending' ? `
                                <button class="action-btn success" onclick="markAsCompleted(${m.id})">
                                    <i data-lucide="check"></i>
                                    标记完成
                                </button>
                            ` : ''}
                            <button class="action-btn" onclick="replyByEmail('${m.email}', '${m.name}')">
                                <i data-lucide="mail"></i>
                                邮件回复
                            </button>
                            <button class="action-btn" onclick="deleteMessage(${m.id})">
                                <i data-lucide="trash-2"></i>
                                删除
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
            
            lucide.createIcons();
        }

        // Filter by status
        function filterMessages(status) {
            currentFilter = status;
            currentType = null;
            
            // Update button states
            document.querySelectorAll('.filter-btn').forEach(function(btn) {
                btn.classList.remove('active');
            });
            document.querySelector('[data-filter="' + status + '"]').classList.add('active');
            
            // Update title
            var titles = { all: '全部消息', new: '新消息', pending: '待处理', completed: '已完成' };
            document.getElementById('listTitle').textContent = titles[status];
            
            renderMessages();
        }

        // Filter by type
        function filterByType(type) {
            currentType = type;
            currentFilter = 'all';
            
            document.querySelectorAll('.filter-btn').forEach(function(btn) {
                btn.classList.remove('active');
            });
            document.querySelector('[data-filter="' + type + '"]').classList.add('active');
            
            document.getElementById('listTitle').textContent = typeLabels[type];
            renderMessages();
        }

        // Search messages
        function searchMessages() {
            renderMessages();
        }

        // Mark as pending
        function markAsPending(id) {
            var messages = loadMessages();
            var msg = messages.find(function(m) { return m.id === id; });
            if (msg) {
                msg.status = 'pending';
                saveMessages(messages);
                updateStats();
                renderMessages();
            }
        }

        // Mark as completed
        function markAsCompleted(id) {
            var messages = loadMessages();
            var msg = messages.find(function(m) { return m.id === id; });
            if (msg) {
                msg.status = 'completed';
                saveMessages(messages);
                updateStats();
                renderMessages();
            }
        }

        // Delete message
        function deleteMessage(id) {
            if (!confirm('确定要删除这条消息吗？')) return;
            var messages = loadMessages();
            messages = messages.filter(function(m) { return m.id !== id; });
            saveMessages(messages);
            updateStats();
            renderMessages();
        }

        // Reply by email
        function replyByEmail(email, name) {
            var subject = encodeURIComponent('回复您的摄影咨询');
            var body = encodeURIComponent('尊敬的 ' + name + '，\n\n感谢您的咨询！\n\n');
            window.open('mailto:' + email + '?subject=' + subject + '&body=' + body);
        }

        // Show notification
        function showNotification() {
            var notification = document.getElementById('notification');
            notification.classList.add('show');
            setTimeout(function() {
                notification.classList.remove('show');
            }, 4000);
        }

        // Check for new messages
        var lastCount = 0;
        function checkNewMessages() {
            var messages = loadMessages();
            var newCount = messages.filter(function(m) { return m.status === 'new'; }).length;
            if (newCount > lastCount && lastCount > 0) {
                showNotification();
            }
            lastCount = newCount;
        }

        // Initialize
        updateStats();
        renderMessages();

        // Check for new messages every 5 seconds
        setInterval(checkNewMessages, 5000);

        // Listen for storage changes (from other tabs)
        window.addEventListener('storage', function(e) {
            if (e.key === 'ronin_messages') {
                updateStats();
                renderMessages();
                checkNewMessages();
            }
        });
    </script>
</body>
</html>
